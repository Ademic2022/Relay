[workspace]
resolver = "3"
members = ["crates/*", "tools/latency-bench", "tools/release", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Ademic2022/Relay"
rust-version = "1.88"
publish = false

[workspace.dependencies]
relay-proto = { path = "crates/relay-proto" }
relay-net = { path = "crates/relay-net" }
relay-capture = { path = "crates/relay-capture" }
relay-codec = { path = "crates/relay-codec" }
relay-crypto = { path = "crates/relay-crypto", default-features = false }
relay-session = { path = "crates/relay-session" }

prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3.3"
ed25519-dalek = "3"
blake3 = "1.8"
getrandom = "0.4"
thiserror = "2"
bytes = "1.12"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
openh264 = "0.9"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_Shutdown",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Codecs are slow unoptimised; keep debug builds and tests realistic.
[profile.dev.package.openh264-sys2]
opt-level = 3
[profile.dev.package.reed-solomon-simd]
opt-level = 3
