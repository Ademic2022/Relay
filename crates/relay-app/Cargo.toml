[package]
name = "relay-app"
description = "Relay engine: host and viewer (the Tauri app in app/ drives it)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "relay"
path = "src/main.rs"

[dependencies]
relay-proto.workspace = true
relay-crypto = { workspace = true, features = ["os-keystore"] }
relay-net.workspace = true
relay-capture.workspace = true
relay-codec.workspace = true
relay-session.workspace = true
relay-input = { path = "../relay-input" }
relay-service = { path = "../relay-service" }
latency-bench = { path = "../../tools/latency-bench" }
anyhow.workspace = true
bytes.workspace = true
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
getrandom.workspace = true
quinn.workspace = true
tokio = { workspace = true, features = ["signal", "process", "io-std", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
wgpu = "30"
winit = "0.30"
pollster = "0.4"
font8x8 = { version = "0.3", default-features = false }
arboard = { version = "3", default-features = false }
jiff = "1"
serde_json = "1"
socket2 = "0.6"
blake3.workspace = true
softbuffer = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }

[dev-dependencies]
ed25519-dalek.workspace = true
relay-server = { path = "../relay-server" }

[lints]
workspace = true
