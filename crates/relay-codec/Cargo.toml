[package]
name = "relay-codec"
description = "Low-latency video Encoder/Decoder traits with hardware and openh264 backends"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
relay-capture.workspace = true
bytes.workspace = true
thiserror.workspace = true
openh264 = { workspace = true, optional = true }
openh264-sys2 = { version = "0.9.10", optional = true }

[features]
default = ["openh264"]
# Software H.264 fallback (C++; needs a native toolchain).
openh264 = ["dep:openh264", "dep:openh264-sys2"]

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
screencapturekit = "12"

[lints]
workspace = true
