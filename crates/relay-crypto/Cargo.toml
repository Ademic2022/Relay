[package]
name = "relay-crypto"
description = "Device keys, Device IDs, passwords and PAKE for Relay"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ed25519-dalek.workspace = true
blake3.workspace = true
getrandom.workspace = true
thiserror.workspace = true
opaque-ke = { version = "4.0.1", features = ["argon2"] }
sha2 = "0.10"
# TOTP (FR-36): RFC 6238 is HMAC-SHA1, which authenticator apps expect.
hmac = "0.12"
sha1 = "0.10"
# OsRng in the rand_core version opaque-ke 4 uses.
rand_core = { version = "0.6", features = ["getrandom"] }
keyring = { version = "4", optional = true }

[features]
default = ["os-keystore"]
# Store the device key in the macOS Keychain / Windows Credential Manager.
os-keystore = ["dep:keyring"]

[lints]
workspace = true
