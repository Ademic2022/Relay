[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # crypto-bigint 0.5 timing issues, pulled in by elliptic-curve 0.13 via
  # opaque-ke 4 / voprf. Relay uses the Ristretto255 suite, whose secret
  # arithmetic is curve25519-dalek, not crypto-bigint (which backs only the
  # NIST-curve types we do not enable). Revisit when opaque-ke ships a
  # stable release on elliptic-curve >= 0.14 / crypto-bigint >= 0.7.6.
  { id = "RUSTSEC-2026-0387", reason = "not on a secret-dependent path with the Ristretto255 suite" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  # Boost Software License 1.0: permissive, OSI-approved (clipboard-win via
  # arboard). Not to be confused with the Business Source License.
  "BSL-1.0",
  # Mozilla Public License 2.0: file-level copyleft. Only via Tauri's HTML
  # tooling (cssparser, selectors, dtoa-short from Servo) and option-ext.
  # Shipping them unmodified is fine; changes to *their* files would have to
  # be published. We do not vendor or patch them.
  "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
